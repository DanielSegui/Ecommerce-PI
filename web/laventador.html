<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini Aventador | D&N Motors</title>
    <link rel="icon" type="image/png" href="./imgs/logoPest.png">
    <link rel="stylesheet" href="./css/vehiculos2.css">
    <link rel="stylesheet" href="./css/detalle_reseñas.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos para las estrellas interactivas */
        .rating-input {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .rating-input span {
            font-size: 30px;
            color: #444;
            cursor: pointer;
            transition: color 0.2s;
        }
        .rating-input span:hover,
        .rating-input span:hover ~ span,
        .rating-input span.active,
        .rating-input span.active ~ span {
            color: gold;
        }
        .comment-card {
            background: #111;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid gold;
            position: relative;
            transition: transform 0.3s;
        }
        .comment-card:hover { transform: scale(1.01); }
        .btn-delete {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .btn-delete:hover { background: #cc0000; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html"><img src="./imgs/logo3.png" alt="D&N Motors"></a>
        </div>
        <div class="user-menu">
            <input type="checkbox" id="toggleMenu" style="display: none;">
            <label for="toggleMenu"><img src="./imgs/menu1.png" class="user-avatar" alt="Menú"></label>
            <ul class="dropdown">
                <li><a href="./auth/profile.php">Perfil</a></li>
                <li><a href="./auth/login.php">Iniciar sesión</a></li>
                <li><a href="./auth/register.php">Registrarse</a></li>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="coches.html">Coches de lujo</a></li>
                <li><a href="motos.html">Motos Superdeportivas</a></li>
                <li><a href="clasicos.html">Coches clásicos</a></li>
                <li><a href="favoritos.html" style="color: #ff4444;">❤ Mis Favoritos</a></li>
                <li><a href="formulario.php">Contacto</a></li>
            </ul>
        </div>
    </header>

    <main class="detalle-container">
        <section class="info-principal">
            <div class="galeria-vip">
                <img src="./imgs/lambo.jpg" alt="Lamborghini Aventador">
            </div>
            
            <div class="detalles-compra">
                <span class="badge-lujo">Disponible</span>
                <br><br>
                <h1>Lamborghini Aventador</h1>
                <p class="precio-especial">460.000 €</p>
                
                <div class="specs-grid">
                    <div class="spec-item"><strong>Motor</strong><span>V12 atmosférico</span></div>
                    <div class="spec-item"><strong>Potencia</strong><span>780 CV</span></div>
                    <div class="spec-item"><strong>0-100</strong><span>2.8s</span></div>
                </div>

                <div class="acciones-compra">
                    <button class="btn-reserva" onclick="window.location.href='reserva.html?modelo=Lamborghini Aventador'">RESERVAR AHORA</button>
                    <button id="btn-favorito" class="btn-favorito">
                        <span class="corazon">❤</span> <span class="texto-fav">Añadir a favoritos</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="reviews-section">
            <h2 class="gold-title">Opiniones de Clientes</h2>
            <form id="commentForm">
                <div class="rating-input" id="starContainer">
                    <span class="star" data-value="5">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="1">★</span>
                </div>
                <textarea id="commentText" placeholder="Escribe tu reseña como experto..." required></textarea>
                <button type="submit" class="btn-reserva btn-small">Publicar Reseña</button>
            </form>
            <div id="commentsContainer" class="margin-top-40"></div>
        </section>
    </main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('commentForm');
    const caja = document.getElementById('commentsContainer');
    const stars = document.querySelectorAll('.star');
    const vehiculoActual = window.location.pathname.split('/').pop().replace('.html', '');
    
    let valoracionSeleccionada = 5;

    // --- LÓGICA DE ESTRELLAS ---
    stars.forEach(s => {
        s.addEventListener('click', function() {
            valoracionSeleccionada = this.dataset.value;
            stars.forEach(st => {
                st.classList.remove('active');
                if(parseInt(st.dataset.value) <= parseInt(valoracionSeleccionada)) {
                    st.classList.add('active');
                }
            });
        });
    });

    // --- CARGAR COMENTARIOS ---
    function cargar() {
        fetch(`gestion_comentarios.php?vehiculo=${vehiculoActual}`)
            .then(res => res.json())
            .then(data => {
                caja.innerHTML = '';
                // data ahora es un objeto { comentarios: [], usuarioSesion: "" }
                data.comentarios.forEach(c => {
                    const esDueño = c.usuario === data.usuarioSesion;
                    const starsDisplay = "★".repeat(c.estrellas) + "☆".repeat(5 - c.estrellas);
                    
                    caja.innerHTML += `
                        <div class="comment-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <strong style="color:gold; font-size:1.1em;">${c.usuario}</strong>
                                <span style="color:gold; letter-spacing:2px;">${starsDisplay}</span>
                            </div>
                            <p style="color:white; margin:0 0 15px 0; line-height:1.6;">${c.texto}</p>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <small style="color:#666;">${c.fecha}</small>
                                ${esDueño ? `<button onclick="borrarComentario('${c.id}')" class="btn-delete">BORRAR MI RESEÑA</button>` : ''}
                            </div>
                        </div>`;
                });
            });
    }

    // --- BORRAR ---
    window.borrarComentario = function(id) {
        if(!confirm("¿Eliminar tu comentario permanentemente?")) return;
        const fd = new FormData();
        fd.append('accion', 'borrar');
        fd.append('id', id);
        
        fetch('gestion_comentarios.php', { method: 'POST', body: fd })
            .then(() => cargar());
    };

    // --- PUBLICAR ---
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const texto = document.getElementById('commentText').value;
        const datos = new FormData();
        datos.append('accion', 'crear');
        datos.append('texto', texto);
        datos.append('estrellas', valoracionSeleccionada);
        datos.append('vehiculo', vehiculoActual);

        fetch('gestion_comentarios.php', { method: 'POST', body: datos })
            .then(res => res.json())
            .then(() => {
                document.getElementById('commentText').value = '';
                // Reset estrellas a 5
                valoracionSeleccionada = 5;
                stars.forEach(st => st.classList.remove('active'));
                cargar();
            });
    });

    cargar();
});
</script>
</body>
</html>
