<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 Carrera GTS | D&N Motors</title>
    <link rel="icon" type="image/png" href="./imgs/logoPest.png">
    <link rel="stylesheet" href="./css/vehiculos2.css">
    <link rel="stylesheet" href="./css/detalle_reseñas.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos para las estrellas interactivas */
        .rating-input { display: flex; flex-direction: row-reverse; justify-content: flex-end; margin-bottom: 10px; }
        .rating-input span { font-size: 30px; color: #444; cursor: pointer; transition: color 0.2s; }
        .rating-input span:hover, .rating-input span:hover ~ span, .rating-input span.active, .rating-input span.active ~ span { color: gold; }
        .comment-card { background: #111; padding: 20px; margin-bottom: 15px; border-radius: 10px; border-left: 4px solid gold; position: relative; transition: transform 0.3s; }
        .comment-card:hover { transform: scale(1.01); }
        .btn-delete { background: #ff4444; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .btn-delete:hover { background: #cc0000; }

        /* NUEVOS ESTILOS FAVORITOS */
        .btn-favorito.is-active .corazon { color: #ff4444 !important; transform: scale(1.2); }
        .btn-favorito.is-active .texto-fav { color: #ff4444; font-weight: bold; }
        .corazon { transition: all 0.3s ease; display: inline-block; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html"><img src="./imgs/logo3.png" alt="D&N Motors"></a>
        </div>
        <div class="user-menu">
            <input type="checkbox" id="toggleMenu" style="display: none;">
            <label for="toggleMenu"><img src="./imgs/menu1.png" class="user-avatar" alt="Menú"></label>
            <ul class="dropdown">
                <li><a href="./auth/profile.php">Perfil</a></li>
                <li><a href="./auth/login.php">Iniciar sesión</a></li>
                <li><a href="./auth/register.php">Registrarse</a></li>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="coches.html">Coches de lujo</a></li>
                <li><a href="motos.html">Motos Superdeportivas</a></li>
                <li><a href="clasicos.html">Coches clásicos</a></li>
                <li><a href="favoritos.html" style="color: #ff4444;">❤ Mis Favoritos</a></li>
                <li><a href="formulario.php">Contacto</a></li>
            </ul>
        </div>
    </header>

    <main class="detalle-container">
        <section class="info-principal">
            <div class="galeria-vip">
                <img src="./imgs/porsche911.webp" alt="Porsche 911 Carrera GTS">
            </div>
            
            <div class="detalles-compra">
                <span class="badge-lujo">Disponible</span>
                <br><br>
                <h1>Porsche 911 Carrera GTS</h1>
                <p class="precio-especial">180.000 €</p>
                
                <div class="specs-grid">
                    <div class="spec-item"><strong>Motor</strong><span>Bóxer de 6 cilindros biturbo</span></div>
                    <div class="spec-item"><strong>Potencia</strong><span>480 CV</span></div>
                    <div class="spec-item"><strong>0-100</strong><span>3.4s</span></div>
                </div>

                <div class="acciones-compra">
                    <button class="btn-reserva" onclick="window.location.href='reserva.html?modelo=Porsche 911 Carrera GTS'">RESERVAR AHORA</button>
                    <button id="btn-favorito" class="btn-favorito">
                        <span class="corazon">❤</span> <span class="texto-fav">Añadir a favoritos</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="reviews-section">
            <h2 class="gold-title">Opiniones de Clientes</h2>
            <form id="commentForm">
                <div class="rating-input" id="starContainer">
                    <span class="star" data-value="5">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="1">★</span>
                </div>
                <textarea id="commentText" placeholder="Escribe tu reseña como experto..." required></textarea>
                <button type="submit" class="btn-reserva btn-small">Publicar Reseña</button>
            </form>
            <div id="commentsContainer" class="margin-top-40"></div>
        </section>
    </main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // --- GESTIÓN DE COMENTARIOS (TU LÓGICA) ---
    const form = document.getElementById('commentForm');
    const caja = document.getElementById('commentsContainer');
    const stars = document.querySelectorAll('.star');
    const vehiculoActual = window.location.pathname.split('/').pop().replace('.html', '');
    let valoracionSeleccionada = 5;

    stars.forEach(s => {
        s.addEventListener('click', function() {
            valoracionSeleccionada = this.dataset.value;
            stars.forEach(st => {
                st.classList.remove('active');
                if(parseInt(st.dataset.value) <= parseInt(valoracionSeleccionada)) st.classList.add('active');
            });
        });
    });

    function cargar() {
        fetch(`gestion_comentarios.php?vehiculo=${vehiculoActual}`)
            .then(res => res.json())
            .then(data => {
                caja.innerHTML = '';
                data.comentarios.forEach(c => {
                    const starsDisplay = "★".repeat(c.estrellas) + "☆".repeat(5 - c.estrellas);
                    caja.innerHTML += `
                        <div class="comment-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <strong style="color:gold; font-size:1.1em;">${c.usuario}</strong>
                                <span style="color:gold; letter-spacing:2px;">${starsDisplay}</span>
                            </div>
                            <p style="color:white; margin:0 0 15px 0; line-height:1.6;">${c.texto}</p>
                            <small style="color:#666;">${c.fecha}</small>
                        </div>`;
                });
            });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const datos = new FormData();
        datos.append('accion', 'crear');
        datos.append('texto', document.getElementById('commentText').value);
        datos.append('estrellas', valoracionSeleccionada);
        datos.append('vehiculo', vehiculoActual);
        fetch('gestion_comentarios.php', { method: 'POST', body: datos }).then(() => {
            document.getElementById('commentText').value = '';
            cargar();
        });
    });

    cargar();

    // --- NUEVA LÓGICA DE FAVORITOS ---
    const btnFav = document.getElementById('btn-favorito');
    const nombreCoche = "Porsche 911 Carrera GTS";

    function actualizarUIFavoritos() {
        let favoritos = JSON.parse(localStorage.getItem('misFavoritos')) || [];
        if (favoritos.includes(nombreCoche)) {
            btnFav.classList.add('is-active');
            btnFav.querySelector('.texto-fav').innerText = "En tus favoritos";
        } else {
            btnFav.classList.remove('is-active');
            btnFav.querySelector('.texto-fav').innerText = "Añadir a favoritos";
        }
    }

    btnFav.addEventListener('click', function() {
        let favoritos = JSON.parse(localStorage.getItem('misFavoritos')) || [];
        if (favoritos.includes(nombreCoche)) {
            favoritos = favoritos.filter(c => c !== nombreCoche);
        } else {
            favoritos.push(nombreCoche);
        }
        localStorage.setItem('misFavoritos', JSON.stringify(favoritos));
        actualizarUIFavoritos();
    });

    actualizarUIFavoritos();
});
</script>
</body>
</html>
