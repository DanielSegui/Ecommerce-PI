<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Reserva | D&N Motors</title>
    <link rel="stylesheet" href="./css/vehiculos2.css">
    <link rel="stylesheet" href="./css/detalle_reseñas.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .reserva-container { max-width: 600px; margin: 80px auto; background: #111; padding: 40px; border-radius: 15px; border: 1px solid goldenrod; box-shadow: 0 0 30px rgba(218, 165, 32, 0.2); }
        .reserva-input { width: 100%; padding: 15px; margin: 15px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 5px; font-family: 'Montserrat', sans-serif; }
        .reserva-label { color: goldenrod; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
    </style>
</head>
<body style="background: #000; color: #fff; font-family: 'Montserrat', sans-serif;">

    <div class="reserva-container">
        <h1 id="header-reserva" style="color: goldenrod; font-size: 2rem; margin-bottom: 10px;">Reserva de Vehículo</h1>
        <p style="color: #888; margin-bottom: 30px;">Complete sus datos para formalizar la prioridad de compra.</p>
        
        <form id="formReserva">
            <label class="reserva-label">Nombre Completo del Titular</label>
            <input type="text" id="nombreCliente" class="reserva-input" placeholder="Ej: Juan Pérez" required>
            
            <label class="reserva-label">Vehículo Seleccionado</label>
            <input type="text" id="nombreVehiculo" class="reserva-input" readonly>
            
            <button type="button" onclick="generarPDF()" class="btn-reserva" style="background: goldenrod; color: #000; border: none; font-weight: 700;">
                DESCARGAR COMPROBANTE PDF
            </button>
        </form>
        <a href="index.html" style="display: block; text-align: center; margin-top: 20px; color: #555; text-decoration: none;">Cancelar y volver</a>
    </div>

    <script>
        // Capturar modelo de la URL (Ej: reserva.html?modelo=Ferrari F8 Tributo)
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const modelo = params.get('modelo');
            if (modelo) {
                document.getElementById('nombreVehiculo').value = modelo;
                document.getElementById('header-reserva').innerText = "Reserva: " + modelo;
            } else {
                document.getElementById('nombreVehiculo').value = "Vehículo no especificado";
            }
        });

        async function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const cliente = document.getElementById('nombreCliente').value;
            const vehiculo = document.getElementById('nombreVehiculo').value;

            if (!cliente) { alert("Introduzca su nombre para la reserva"); return; }

            // Diseño del PDF
            doc.setFillColor(0, 0, 0);
            doc.rect(0, 0, 210, 50, 'F');
            doc.setTextColor(218, 165, 32);
            doc.setFontSize(26);
            doc.text("D&N MOTORS", 105, 30, { align: "center" });
            
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(14);
            doc.text("CERTIFICADO DE RESERVA", 105, 70, { align: "center" });
            
            doc.setFontSize(12);
            doc.text(`Por la presente, se confirma la reserva a nombre de:`, 20, 90);
            doc.setFontSize(16);
            doc.text(cliente.toUpperCase(), 20, 100);
            
            doc.setFontSize(12);
            doc.text(`Vehículo reservado:`, 20, 120);
            doc.setFontSize(18);
            doc.setTextColor(218, 165, 32);
            doc.text(vehiculo, 20, 130);
            
            doc.setTextColor(150, 150, 150);
            doc.setFontSize(10);
            doc.text("Fecha de emisión: " + new Date().toLocaleString(), 20, 160);
            doc.text("Este documento garantiza la prioridad de contacto para la compra del vehículo.", 20, 170);

            doc.save(`Reserva_DNMotors_${vehiculo.replace(/\s+/g, '_')}.pdf`);
        }
    </script>
</body>
</html>
